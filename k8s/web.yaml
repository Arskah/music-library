# The web page backend. An init container applies the schema as `admin`; the
# page itself connects as `web`, which can read the catalogue and keep the
# drafts and nothing else.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits for the database, applies the schema and sets the password
        # `web` connects with.
        - name: migrate
          image: library-search
          args: ["migrate"]
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-password
                  key: password
            - name: DATABASE_URL
              value: postgres://admin:$(ADMIN_PASSWORD)@postgres:5432/library
            - name: WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-db
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: web
          image: library-search
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: web-login
                  key: login
            # Optional so that the page starts before the secret is sealed;
            # it then has no webhook endpoint.
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-webhook
                  key: secret
                  optional: true
            - name: WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-db
                  key: password
            - name: DATABASE_URL
              value: postgres://web:$(WEB_PASSWORD)@postgres:5432/library
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Every route asks for the login or a signature, so there is nothing
          # for an HTTP probe to ask.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          # Node settles near 90Mi serving the page.
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
