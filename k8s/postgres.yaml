# The hub. One replica on the cluster's NFS storage class, as the other
# databases here run; fine for a test, not a place for data that matters.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: library
            - name: POSTGRES_USER
              value: library
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hub
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: db
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "library", "-d", "library"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
