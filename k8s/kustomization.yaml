apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-library

resources:
  - namespace.yaml
  - postgres.yaml
  - web.yaml
  - gateway.yaml

images:
  - name: library-search
    newName: registry.aarnihalinen.fi/library-search
    newTag: 0.3.0

# The secrets `hub` (database password), `web-login` (the page's shared login) and
# `regcred` (registry pull secret) are not created here. They are SealedSecrets in
# github.com/Arskah/kube, sealed-secrets/, so that ArgoCD can render this directory
# without files that are not committed.
