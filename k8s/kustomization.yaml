apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: music-library

resources:
  - namespace.yaml
  - postgres.yaml
  - web.yaml
  - gateway.yaml

images:
  - name: library-search
    newName: forge.aarnihalinen.fi/arska/music-library
    newTag: 0.6.0

# The secrets `admin-password` (the database's `admin` password), `web-db` (the page's own
# database password), `web-login` (the page's shared login) and `web-webhook` (the now-playing
# webhook's signing secret) are not created here. They are SealedSecrets in
# github.com/Arskah/kube, sealed-secrets/, so that ArgoCD can render this directory
# without files that are not committed.
